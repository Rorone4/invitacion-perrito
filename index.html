<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta property="og:title" content="🐶🐱 Encuesta oficial">
<meta property="og:description" content="5 preguntas. 0 respuestas incorrectas. Bueno... casi.">

<style>
body{
    font-family: Arial, sans-serif;
    background:#fff4e6;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:400px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.si{
    background:#4CAF50;
    color:white;
}

.no{
    background:#f44336;
    color:white;
}

select,
input[type=date]{
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    width:220px;
}
</style>
</head>

<body>

<div class="card" id="contenido">

    <h1>🐶🐱</h1>

    <h2>Hola</h2>

    <p>
        Necesito que respondas este cuestionario muy importante:
    </p>

    <button class="si" onclick="pregunta()">
        Continuar
    </button>

</div>
    
<audio id="musica" autoplay loop>
    <source src="Musica1.mp3" type="audio/mpeg">
</audio>
    
<script>

function pregunta(){

    const musica = document.getElementById("musica");

    if(musica){
        musica.volume = 0.4;
        musica.play().catch(function(error){
            console.log(error);
        });
    }

    document.getElementById("contenido").innerHTML = `

        <h1>🐶🐱</h1>

        <h2>¿Te gustaría salir conmigo?</h2>

        <button class="si" onclick="acepto()">
            Sí
        </button>

        <button class="no" onclick="rechazo()">
            No
        </button>

    `;
}

function acepto(){

    document.getElementById("contenido").innerHTML = `

        <h1>🐶😳</h1>

        <h2>¡Espera...!</h2>

        <p>¿Dijiste que sí...? No me lo creo</p>

        <p>Selecciona qué día estás libre 📅</p>

        <input type="date" id="fecha">

        <br><br>

        <button class="si" onclick="confirmar()">
            Siguiente
        </button>

    `;
}

function rechazo(){

    document.getElementById("contenido").innerHTML = `

        <h1>⚠️</h1>

        <h2>La opción seleccionada no está disponible 😆.</h2>

        <button class="si" onclick="pregunta()">
            Por favor intentalo nuevamente, no te equivoques XD
        </button>

    `;
}

function confirmar(){

    let fecha = document.getElementById("fecha").value;

    if(!fecha){
        alert("Selecciona una fecha");
        return;
    }

    window.fechaElegida = fecha;

    document.getElementById("contenido").innerHTML = `

        <h1>🐶🐱</h1>

        <h2>Una última pregunta</h2>

        <p>
            ¿Qué te gustaría hacer ese día?
        </p>

        <select id="actividad">

            <option value="">
                Selecciona una opción
            </option>

            <option value="Tomar un café, o solo agua ☕">
                Tomar un café ☕
            </option>

            <option value="Comer algo rico o engordar 🍕">
                Comer algo rico 🍕
            </option>

            <option value="Ir por un helado, qué calor🍨">
                Ir por un helado 🍨
            </option>

            <option value="Dar un paseo, no menor a 2h 🚶">
                Dar un paseo 🚶
            </option>

            <option value="Tú eliges 😎">
                Tú eliges 😎
            </option>

        </select>

        <br><br>

        <button class="si" onclick="finalizar()">
            Confirmar salida
        </button>

    `;
}

function finalizar(){

    let actividad = document.getElementById("actividad").value;

    if(!actividad){
        alert("Selecciona una actividad");
        return;
    }
    fetch("https://script.google.com/macros/s/AKfycbwlN8FWDmuahXkSpZ_VbgJZCDF_e6ItSwDnsBBslUs297kSY3hutTtn5uzBYDGkaIqT/exec", {
        method: "POST",
        body: JSON.stringify({
            fecha: window.fechaElegida,
            actividad: actividad
        })
    });

    document.getElementById("contenido").innerHTML = `

        <h1>🐶🐱</h1>

        <h2>¡Perfecto!</h2>

        <p>Fecha elegida:</p>

        <h3>${window.fechaElegida}</h3>

        <p>Plan elegido:</p>

        <h3>${actividad}</h3>

        <p>
            Tu solicitud ya quedó registrada.
        </p>

        <p>
            Ahora me toca organizar el plan 😎, espero no te desanimes xd 
        </p>

    `;
}

</script>

</body>
</html>
